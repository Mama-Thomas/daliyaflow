# Production reverse proxy + static frontend serving.
#
# In real prod, SSL terminates at the AWS ALB upstream of nginx, so this
# config only listens on HTTP and trusts the X-Forwarded-* headers from the
# ALB. Security headers below are still applied so they reach the browser.

worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Real client IP from the ALB
    set_real_ip_from     10.0.0.0/8;
    real_ip_header       X-Forwarded-For;
    real_ip_recursive    on;

    upstream daliyaflow_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream daliyaflow_frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    log_format json_combined escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';
    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 30M;

        # Security headers — applied to every response.
        add_header X-Frame-Options           "DENY"                          always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://api.anthropic.com https://*.amazonaws.com; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API
        location /api/ {
            proxy_pass         http://daliyaflow_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection           "";
            proxy_set_header   Host                 $host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
            proxy_set_header   X-Request-ID         $request_id;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /health {
            proxy_pass http://daliyaflow_api/health;
            access_log off;
        }

        # Hashed assets — cache aggressively.
        location ~* ^/assets/.*\.(?:js|css|woff2?|svg|png|jpg|webp)$ {
            proxy_pass http://daliyaflow_frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Service worker / index.html — never cache.
        location = /index.html {
            proxy_pass http://daliyaflow_frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires off;
        }

        # SPA fallback — every other path goes to the frontend, which serves
        # index.html and lets React Router handle the route client-side.
        location / {
            proxy_pass         http://daliyaflow_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
