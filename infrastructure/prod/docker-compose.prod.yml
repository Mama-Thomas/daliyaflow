# Production-parity Docker Compose stack for staging-style smoke tests.
#
# Real production runs on AWS ECS Fargate (per SKILL.md section 10) — see
# infrastructure/prod/ecs-task-definition-template.json. This file is the
# local mirror: no bind mounts, no reload flags, gunicorn + uvicorn workers
# for the API, nginx for static frontend assets.
#
# Secrets MUST be supplied via environment (in real prod via AWS Secrets
# Manager + ECS task definition `secrets` block — never via .env).
services:
  backend:
    image: daliyaflow/backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_REGION: ${AWS_REGION}
      AUDIO_BUCKET: ${AUDIO_BUCKET}
      SENTRY_DSN: ${SENTRY_DSN}
      SEND_EMAILS: "true"
      EMAIL_PROVIDER: ses
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      APP_BASE_URL: ${APP_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    command:
      - gunicorn
      - app.main:app
      - --workers
      - "4"
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: daliyaflow/backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AWS_REGION: ${AWS_REGION}
      AUDIO_BUCKET: ${AUDIO_BUCKET}
      SENTRY_DSN: ${SENTRY_DSN}
    command: celery -A app.workers.tasks worker --concurrency=4 --loglevel=warning
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.tasks inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: daliyaflow/frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend

  edge:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
