name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY_BACKEND: daliyaflow-backend
  ECR_REPOSITORY_FRONTEND: daliyaflow-frontend
  ECS_CLUSTER: daliyaflow-prod
  ECS_SERVICE_API: daliyaflow-api
  ECS_SERVICE_WORKER: daliyaflow-worker

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push backend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY_BACKEND:$IMAGE_TAG ./backend
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          docker tag $ECR_REPOSITORY_BACKEND:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          echo "BACKEND_IMAGE=$REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build, tag, push frontend image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY_FRONTEND:$IMAGE_TAG ./frontend
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          docker tag $ECR_REPOSITORY_FRONTEND:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          echo "FRONTEND_IMAGE=$REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/prod/ecs-task-definition-template.json
          container-name: backend
          image: ${{ env.BACKEND_IMAGE }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test staging endpoint
        run: |
          set -e
          STAGING_URL="${{ secrets.STAGING_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL not configured — skipping smoke check."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fs "$STAGING_URL/health" | grep -q '"status":"ok"'; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check did not return ok — aborting."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed. Wire a real notification (Slack / PagerDuty)"
          echo "by setting NOTIFICATION_WEBHOOK_URL and adding a curl step here."
