name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: daliyaflow_test
          POSTGRES_USER: daliya
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daliya"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://daliya:testpassword@localhost:5432/daliyaflow_test
        run: alembic upgrade head

      - name: Run security tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://daliya:testpassword@localhost:5432/daliyaflow_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          celery -A app.workers.tasks worker --loglevel=warning &
          sleep 5
          python -m tests.security.run_all

      - name: Run pipeline e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://daliya:testpassword@localhost:5432/daliyaflow_test
          REDIS_URL: redis://localhost:6379/0
        run: python -m tests.test_pipeline_e2e

      - name: Pip audit (HIGH/CRITICAL)
        working-directory: backend
        run: pip-audit --requirement requirements.txt --strict || true

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci || npm install
          npm run typecheck
          npm run build
          npm audit --audit-level=high || true

  docker-build:
    name: Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        working-directory: infrastructure
        run: docker compose config --quiet
      - name: Build images
        working-directory: infrastructure
        run: docker compose build --no-cache
